[package]
name = "cryomorph-core"
version = "0.1.0"
edition = "2021"
authors = ["Meryem Güçlü <lifevern@gmail.com>"]
description = "High-performance Cryo-EM MRC binary parser and SIMD CTF computation engine"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
byteorder = "1.5"
rayon = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
